[package]
name = "xtask"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
description = "lengua's tooling, run as `cargo xtask <task>`: each step of CI's workflow, the release archive, the goldens' comparison and the bench's WebAssembly builds."
publish = false

# The crates W17's research names, or the workspace's own, none of them C. Where lengua-mcp has a
# crate too, the same features, so that a build of the whole workspace compiles lengua-mcp as it
# ships: ureq would turn on rustls's logging there, so the downloads use lengua's own TLS.
[dependencies]
# gzip, with its pure-Rust backend: wasi-sdk's tar.gz, and the release's.
flate2 = "1.1"
# HTTPS for the downloads: rustls with ring, and Mozilla's roots, as lengua-mcp has them.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
# cargo's messages, which name the release check it built.
serde_json = "1"
# SHA-256, the 0.10.9 the workspace already has, which tools.tsv's pins are checked with.
sha2 = "0.10.9"
# tar archives, without extended attributes: wasi-sdk's, and the release's.
tar = { version = "0.4.46", default-features = false }
# The release's staging folder, and the tests' folders.
tempfile = "3"
# zip archives, deflated only: the solvers' downloads, and Windows's release archive.
zip = { version = "9.5", default-features = false, features = ["deflate-flate2"] }

# The workspace's lints: no unsafe code, every item documented, no unwrap (CI's clippy denies
# every warning).
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
