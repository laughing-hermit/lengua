[package]
name = "xtask"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
description = "lengua's tooling, run as `cargo xtask <task>`: each step of CI's workflow, the release archive, the goldens' comparison and the bench's WebAssembly builds."
publish = false

# Each crate as the research for W17 names it, and none of them C. Where lengua-mcp has a crate
# too, the same features, so that a build of the whole workspace compiles lengua-mcp as it ships.
[dependencies]
# gzip, with its pure-Rust backend: wasi-sdk's tar.gz.
flate2 = "1.1"
# HTTPS for the downloads: lengua's own TLS, rustls with ring, and Mozilla's roots.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
# SHA-256, the 0.10.9 the workspace already has, which tools.tsv's pins are checked with.
sha2 = "0.10.9"
# tar archives, without extended attributes.
tar = { version = "0.4.46", default-features = false }
# zip archives, deflated only: the solvers' downloads.
zip = { version = "9.5", default-features = false, features = ["deflate-flate2"] }

# The tests' folders, with the tempfile the workspace already has.
[dev-dependencies]
tempfile = "3"

# The workspace's lints: no unsafe code, every item documented, no unwrap (CI's clippy denies
# every warning).
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
