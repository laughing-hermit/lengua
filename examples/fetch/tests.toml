[[example]]
id = "B1"
args = ["{port}", "/hello"]
server = { receives = "GET /hello HTTP/1.0\r\n\r\n", replies = "HTTP/1.0 200 OK\r\n\r\nhello world" }
stdout = "hello world"
exit_code = 0

[[example]]
id = "B2"
stderr = "usage: fetch <port> <path>\n"
exit_code = 1

[[example]]
id = "B3"
args = ["80x", "/"]
stderr = "error: bad port\n"
exit_code = 2

[[example]]
id = "B4"
args = ["1", "/"]
stderr = "error: can't reach the server\n"
exit_code = 3

[[generated]]
id = "B1"
vars = { path = 'string(1, 100, "/abcdefghijklmnopqrstuvwxyz0123456789-._~")', body = 'string(0, 65000, "abcdefghijklmnopqrstuvwxyz \n")' }
args = ["{port}", "{path}"]
server = { receives = "GET {path} HTTP/1.0\r\n\r\n", replies = "HTTP/1.0 200 OK\r\n\r\n{body}" }
stdout = "{body}"
exit_code = 0

[[generated]]
id = "B3"
vars = { port = 'choice("80x", "", "-", "0", "65536", "-80", "1.5", "99999999999999999999")', path = 'choice("/")' }
args = ["{port}", "{path}"]
stderr = "error: bad port\n"
exit_code = 2

