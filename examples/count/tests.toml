[[example]]
id = "B4"
args = ["file.txt"]
stderr = "usage: count < input\n"
exit_code = 1

[[generated]]  # text with sparse whitespace, as in prose
id = "B1"
runs = 300
vars = { text = 'string(0, 1048576, "abcdefghijklmnopqrstuvwxyz0123456789 \n")' }
stdin = "{text}"
stdout = "{count(text, \"\n\")} {words(text)}\n"
exit_code = 0

[[generated]]  # text dense with every kind of whitespace
id = "B1"
