name: targets

# lengua built and tested natively on the two Linux targets, x86-64 and ARM64, free on a public
# repository: this workflow builds both and runs every test on x86-64, and checks the formatting
# both share; ARM64 Linux's tests are arm64.yml's. The four targets that don't exist yet, macOS and
# Windows each on x86-64 and ARM64, are built by unported.yml, weekly and on request, so their
# queues and their always-red builds don't hold up a push.
#
# A branch named wip/... gets no push run (its author dispatches the run it wants), so a branch
# being worked on doesn't cost a 35-minute suite for every push.
on:
  push:
    branches-ignore:
      - "wip/**"
    paths:
      - "src/**"
      - "tests/**"
      - "plugin/**"
      - "benches/**"
      - "examples/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/**"
  workflow_dispatch:
    inputs:
      filter:
        description: "Only the tests whose names contain this (cargo test's filter), on Linux x86-64"
        type: string
        default: ""
      ignored:
        description: "Also run the slow ignored tests (the checker golden, the mutation test) on Linux x86-64"
        type: boolean
        default: false
      check_folder:
        description: "Program folders, comma-separated, for the ignored check_one_folder test (LENGUA_CHECK_FOLDER)"
        type: string
        default: ""
      stall_seconds:
        description: "Stop the slow ignored tests after this many seconds, keeping where they stood (stall.txt)"
        type: string
        default: ""
      benchmarks:
        description: "Measure lengua against C, C++ and Rust here on Linux x86-64 instead of testing"
        type: boolean
        default: false
      release:
        description: "Build and check the release archive for x86-64 Linux instead of testing"
        type: boolean
        default: false

concurrency:
  group: targets-${{ github.ref }}-${{ github.event_name }}-${{ inputs.check_folder }}-${{ inputs.filter }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_VERSION: "1.99.1"
  LLVM_VERSION: "22"
  Z3_VERSION: "4.16.0"
  Z3_SHA256: "7288c49a5bd6dbafd7b0b0d1f65956b91672da24b08f09242919af159be3418e"
  CVC5_VERSION: "1.3.4"
  CVC5_SHA256: "dcdbfada0ce493ee98259c0816e0daafc561c223aadb3af298c2968e73ea39c6"
  CARGO_TERM_COLOR: never

jobs:
  build:
    name: build (${{ matrix.target }})
    # A dispatched run is for one thing (a filter, a folder, a benchmark): its test job builds it.
    if: github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: linux-x86_64, ported: true }
          - { runner: ubuntu-24.04-arm, target: linux-aarch64, ported: true }
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ !matrix.ported }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Rust ${{ env.RUST_VERSION }}
        run: |
          if ! command -v rustup > /dev/null; then
            if [ "$RUNNER_OS" = Windows ]; then
              arch=x86_64
              [ "$RUNNER_ARCH" = ARM64 ] && arch=aarch64
              curl -sSfL -o rustup-init.exe \
                "https://static.rust-lang.org/rustup/dist/$arch-pc-windows-msvc/rustup-init.exe"
              ./rustup-init.exe -y --profile minimal --default-toolchain none
              echo "$USERPROFILE/.cargo/bin" >> "$GITHUB_PATH"
              export PATH="$USERPROFILE/.cargo/bin:$PATH"
            else
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain none
              echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
              export PATH="$HOME/.cargo/bin:$PATH"
            fi
          fi
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustc --version --verbose

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: targets-${{ matrix.target }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: targets-${{ matrix.target }}-${{ env.RUST_VERSION }}-

      - name: Build lengua's server natively
        run: cargo build --release --locked --bin lengua-mcp

      - name: Keep the server
        uses: actions/upload-artifact@v4
        with:
          name: lengua-mcp-${{ matrix.target }}
          path: |
            target/release/lengua-mcp
            target/release/lengua-mcp.exe
          retention-days: 7
          if-no-files-found: ignore

  # Formatting is the same on every target, so it is checked once, beside the tests of both CPUs
  # rather than in front of them: a difference never hides a test result. When there is one, the
  # patch that formats it is kept (fmt.patch), to apply with git.
  format:
    name: format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Rust ${{ env.RUST_VERSION }}
        run: |
          if ! command -v rustup; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt
          rustup default "$RUST_VERSION"

      - name: Format
        run: |
          if ! cargo fmt --check; then
            cargo fmt
            git diff > fmt.patch
            exit 1
          fi

      - name: Keep the patch
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fmt-patch-${{ github.run_number }}
          path: fmt.patch
          retention-days: 7
          if-no-files-found: ignore

  test-linux-x86_64:
    name: test (linux-x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: The machine
        run: |
          uname -a
          nproc
          grep -m1 "model name" /proc/cpuinfo || true
          echo "AVX-512: $(grep -o "avx512[a-z]*" /proc/cpuinfo | sort -u | tr '\n' ' ' || true)"
          echo "LSMs: $(cat /sys/kernel/security/lsm 2>/dev/null || echo unknown)"
          echo "ptrace_scope: $(cat /proc/sys/kernel/yama/ptrace_scope 2>/dev/null || echo none)"
          sudo sysctl kernel.perf_event_paranoid=1 || true
          {
            echo "### The machine"
            echo
            echo "$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ //'), $(nproc) vCPUs, kernel $(uname -r)"
            echo
            flags=$(grep -m1 '^flags' /proc/cpuinfo || true)
            for flag in sse4_2 popcnt pclmulqdq aes sha_ni avx2 bmi1 bmi2 avx512bw; do
              if grep -qw "$flag" <<< "$flags"; then echo "- $flag: yes"; else echo "- $flag: no"; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rust ${{ env.RUST_VERSION }}
        run: |
          if ! command -v rustup; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy
          rustup default "$RUST_VERSION"

      - name: LLVM ${{ env.LLVM_VERSION }}
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-$LLVM_VERSION main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update -q
          sudo apt-get install -y -q "llvm-$LLVM_VERSION" "lld-$LLVM_VERSION"
          echo "/usr/lib/llvm-$LLVM_VERSION/bin" >> "$GITHUB_PATH"

      - uses: actions/cache@v4
        id: solvers
        with:
          path: ~/solvers
          key: solvers-x64-${{ env.Z3_SHA256 }}-${{ env.CVC5_SHA256 }}

      - name: z3 and cvc5, pinned by checksum
        if: steps.solvers.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/solvers/download ~/solvers/bin
          cd ~/solvers/download
          curl -sSfL -o z3.zip \
            "https://github.com/Z3Prover/z3/releases/download/z3-$Z3_VERSION/z3-$Z3_VERSION-x64-glibc-2.39.zip"
          curl -sSfL -o cvc5.zip \
            "https://github.com/cvc5/cvc5/releases/download/cvc5-$CVC5_VERSION/cvc5-Linux-x86_64-static.zip"
          echo "$Z3_SHA256  z3.zip" | sha256sum -c -
          echo "$CVC5_SHA256  cvc5.zip" | sha256sum -c -
          unzip -q z3.zip
          unzip -q cvc5.zip
          cp -r "z3-$Z3_VERSION-x64-glibc-2.39/bin/." ~/solvers/bin/
          cp cvc5-Linux-x86_64-static/bin/cvc5 ~/solvers/bin/
          cd ~
          rm -rf ~/solvers/download

      - name: The tools
        run: |
          echo "$HOME/solvers/bin" >> "$GITHUB_PATH"
          ~/solvers/bin/z3 --version
          ~/solvers/bin/cvc5 --version | head -1
          llvm-mc --version | head -2
          ld.lld --version
          rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-x64-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: test-x64-${{ env.RUST_VERSION }}-

      - name: Clippy
        run: cargo clippy --release --all-targets --locked -- -D warnings

      - name: Tests
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.benchmarks || inputs.release)) }}
        env:
          LENGUA_PROOF_SECONDS: "60"
          RUST_TEST_THREADS: "2"
          FILTER: ${{ github.event_name == 'workflow_dispatch' && inputs.filter || '' }}
          LENGUA_SKIP_LOG: ${{ github.workspace }}/skips.log
        run: cargo test --release --locked --no-fail-fast $FILTER 2>&1 | tee test.log

      - name: Benchmarks against C, C++ and Rust
        if: github.event_name == 'workflow_dispatch' && inputs.benchmarks
        run: |
          sudo apt-get install -y -q time
          cargo bench --locked --bench against_rust_and_c 2>&1 | tee bench.log

      - name: The release archive for x86-64 Linux
        if: github.event_name == 'workflow_dispatch' && inputs.release
        run: scripts/release.sh

      - name: The slow ignored tests
        if: github.event_name == 'workflow_dispatch' && inputs.ignored
        env:
          LENGUA_PROOF_SECONDS: "60"
          RUST_TEST_THREADS: "2"
          FILTER: ${{ inputs.filter }}
          LENGUA_CHECK_FOLDER: ${{ inputs.check_folder }}
          STALL_SECONDS: ${{ inputs.stall_seconds }}
          LENGUA_SKIP_LOG: ${{ github.workspace }}/skips.log
        run: |
          tests='set -o pipefail; cargo test --release --locked --no-fail-fast $FILTER -- --ignored --nocapture 2>&1 | tee ignored.log'
          if [ -n "$STALL_SECONDS" ]; then
            bash scripts/stall-report.sh "$STALL_SECONDS" bash -c "$tests"
          else
            bash -c "$tests"
          fi

      # A green run says what it did not cover: libtest hides what a passing test prints, so a
      # test that skips itself notes why (lengua::skiplog) and the notes are counted here.
      - name: What the tests skipped
        if: always()
        run: bash scripts/skip-summary.sh skips.log | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the logs and the server
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-linux-x86_64-${{ github.run_number }}
          path: |
            test.log
            ignored.log
            skips.log
            stall.txt
            bench.log
            BENCHMARKS.md
            target/release/lengua-mcp
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 7
          if-no-files-found: ignore
