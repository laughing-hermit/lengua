name: ci

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "compile (clippy, the tests built, the binary built) or test (the tests run too)"
        type: choice
        options: [compile, test]
        default: test
      targets:
        description: "all, or a comma list of linux-x86_64, linux-aarch64, macos-aarch64, windows-x86_64, windows-aarch64"
        type: string
        default: linux-x86_64
  schedule:
    - cron: "23 5 * * 1"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}-${{ inputs.mode }}-${{ inputs.targets }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'test' }}
          TARGETS: ${{ github.event_name == 'workflow_dispatch' && inputs.targets || 'all' }}
        run: |
          all='[
            {"target": "linux-x86_64", "runner": "ubuntu-24.04"},
            {"target": "linux-aarch64", "runner": "ubuntu-24.04-arm"},
            {"target": "macos-aarch64", "runner": "macos-26"},
            {"target": "windows-x86_64", "runner": "windows-2025"},
            {"target": "windows-aarch64", "runner": "windows-11-arm"}
          ]'
          wanted=$(jq -cn --arg t "$TARGETS" --argjson all "$all" \
            'if $t == "all" then [$all[].target] else $t | split(",") | map(gsub("\\s"; "")) | map(select(. != "")) end')
          unknown=$(jq -cn --argjson w "$wanted" --argjson all "$all" '$w - [$all[].target]')
          if [ "$unknown" != "[]" ] || [ "$wanted" = "[]" ]; then
            echo "::error::unknown or empty targets: $TARGETS"
            exit 1
          fi
          matrix=$(jq -cn --argjson w "$wanted" --argjson all "$all" '[$all[] | select(.target as $x | $w | index($x))]')
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "mode $MODE on $matrix"

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: toolchain
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" --profile minimal --component rustfmt
      - name: cargo fmt --check
        id: fmt
        run: |
          if cargo fmt --all --check; then
            exit 0
          fi
          cargo fmt --all
          git diff > fmt.patch
          echo "differs=true" >> "$GITHUB_OUTPUT"
          exit 1
      - if: ${{ failure() && steps.fmt.outputs.differs == 'true' }}
        uses: actions/upload-artifact@v5
        with:
          name: fmt-patch-${{ github.run_number }}
          path: fmt.patch

  lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: toolchain
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" --profile minimal
      - name: Cargo.lock up to date
        id: lock
        run: |
          if cargo metadata --locked --format-version 1 > /dev/null; then
            exit 0
          fi
          cargo metadata --format-version 1 > /dev/null
          git diff --stat -- Cargo.lock
          echo "differs=true" >> "$GITHUB_OUTPUT"
          exit 1
      - if: ${{ failure() && steps.lock.outputs.differs == 'true' }}
        uses: actions/upload-artifact@v5
        with:
          name: cargo-lock-${{ github.run_number }}
          path: Cargo.lock

  check:
    needs: plan
    name: ${{ needs.plan.outputs.mode }} (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - name: rustup
        run: |
          if ! command -v rustup > /dev/null; then
            if [ "${{ matrix.target }}" != windows-aarch64 ]; then
              echo "::error::no rustup on ${{ matrix.runner }}"
              exit 1
            fi
            curl -sSfL -o rustup-init.exe https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe
            ./rustup-init.exe -y --default-toolchain none --profile minimal
            echo "$USERPROFILE\\.cargo\\bin" >> "$GITHUB_PATH"
          fi
      - name: toolchain
        run: |
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" \
            --profile minimal --component rustfmt,clippy --target wasm32-wasip2,wasm32-unknown-unknown
          rustc --version
          cargo --version
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: tests built
        if: ${{ needs.plan.outputs.mode == 'compile' }}
        run: cargo test --workspace --locked --no-run
      - name: tests run
        if: ${{ needs.plan.outputs.mode == 'test' }}
        run: cargo test --workspace --locked
      - name: the imports of the built examples, as Wasmtime reads them
        if: ${{ !cancelled() && needs.plan.outputs.mode == 'test' }}
        run: |
          for f in $(find target/tmp -path '*wasm32-wasip2/release/*.wasm' -not -path '*/deps/*' -not -path '*/build/*' | sort); do
            echo "$f: $(wc -c < "$f") bytes"
            cargo run --locked -q -p lengua-mcp -- imports "$f"
          done
      - name: the time of each check, from the first call to the end of its job
        if: ${{ !cancelled() && needs.plan.outputs.mode == 'test' }}
        run: |
          if [ -f target/tmp/lengua-timings.txt ]; then
            sort target/tmp/lengua-timings.txt
          else
            echo "no timings"
          fi
      - name: the time clippy adds to the build of hello world
        if: ${{ !cancelled() && needs.plan.outputs.mode == 'test' }}
        run: |
          d=target/tmp/lengua-mcp-hello/hello
          if [ ! -f "$d/Cargo.toml" ]; then
            echo "no built hello world"
            exit 0
          fi
          cd "$d"
          cargo clean -q
          TIMEFORMAT='fmt --check: %R s'
          time cargo fmt --check
          TIMEFORMAT='clippy, from clean: %R s'
          time cargo clippy -q --release --target wasm32-wasip2 --offline -- -D warnings
          TIMEFORMAT='build, after clippy: %R s'
          time cargo build -q --release --target wasm32-wasip2 --offline
          cargo clean -q
          TIMEFORMAT='build alone, from clean: %R s'
          time cargo build -q --release --target wasm32-wasip2 --offline
      - name: lengua-mcp built
        run: |
          cargo build --release --locked -p lengua-mcp
          ./target/release/lengua-mcp --version
