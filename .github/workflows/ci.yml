name: ci

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "compile (clippy, the tests built, the binary built) or test (the tests run too)"
        type: choice
        options: [compile, test]
        default: test
      targets:
        description: "all, or a comma list of linux-x86_64, linux-aarch64, macos-aarch64, windows-x86_64, windows-aarch64"
        type: string
        default: linux-x86_64
  schedule:
    - cron: "23 5 * * 1"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}-${{ inputs.mode }}-${{ inputs.targets }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'test' }}
          TARGETS: ${{ github.event_name == 'workflow_dispatch' && inputs.targets || 'all' }}
        run: |
          all='[
            {"target": "linux-x86_64", "runner": "ubuntu-24.04"},
            {"target": "linux-aarch64", "runner": "ubuntu-24.04-arm"},
            {"target": "macos-aarch64", "runner": "macos-26"},
            {"target": "windows-x86_64", "runner": "windows-2025"},
            {"target": "windows-aarch64", "runner": "windows-11-arm"}
          ]'
          wanted=$(jq -cn --arg t "$TARGETS" --argjson all "$all" \
            'if $t == "all" then [$all[].target] else $t | split(",") | map(gsub("\\s"; "")) | map(select(. != "")) end')
          unknown=$(jq -cn --argjson w "$wanted" --argjson all "$all" '$w - [$all[].target]')
          if [ "$unknown" != "[]" ] || [ "$wanted" = "[]" ]; then
            echo "::error::unknown or empty targets: $TARGETS"
            exit 1
          fi
          matrix=$(jq -cn --argjson w "$wanted" --argjson all "$all" '[$all[] | select(.target as $x | $w | index($x))]')
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "mode $MODE on $matrix"

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: toolchain
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" --profile minimal --component rustfmt
      - name: cargo fmt --check
        id: fmt
        run: |
          if cargo fmt --all --check; then
            exit 0
          fi
          cargo fmt --all
          git diff > fmt.patch
          echo "differs=true" >> "$GITHUB_OUTPUT"
          exit 1
      - if: ${{ failure() && steps.fmt.outputs.differs == 'true' }}
        uses: actions/upload-artifact@v5
        with:
          name: fmt-patch-${{ github.run_number }}
          path: fmt.patch

  check:
    needs: plan
    name: ${{ needs.plan.outputs.mode }} (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - name: rustup
        run: |
          if ! command -v rustup > /dev/null; then
            if [ "${{ matrix.target }}" != windows-aarch64 ]; then
              echo "::error::no rustup on ${{ matrix.runner }}"
              exit 1
            fi
            curl -sSfL -o rustup-init.exe https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe
            ./rustup-init.exe -y --default-toolchain none --profile minimal
            echo "$USERPROFILE\\.cargo\\bin" >> "$GITHUB_PATH"
          fi
      - name: toolchain
        run: |
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" \
            --profile minimal --component rustfmt,clippy --target wasm32-wasip2,wasm32-unknown-unknown
          rustc --version
          cargo --version
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: tests built
        if: ${{ needs.plan.outputs.mode == 'compile' }}
        run: cargo test --workspace --locked --no-run
      - name: tests run
        if: ${{ needs.plan.outputs.mode == 'test' }}
        run: cargo test --workspace --locked
      - name: lengua-mcp built
        run: |
          cargo build --release --locked -p lengua-mcp
          ./target/release/lengua-mcp --version
