name: ci

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "compile (clippy, the tests built, the binary built), test (the tests run too) or wiki (check writes the wiki of libraries/ and examples/ in place, as an artifact)"
        type: choice
        options: [compile, test, wiki]
        default: test
      targets:
        description: "all, or a comma list of linux-x86_64, linux-aarch64, macos-aarch64, windows-x86_64, windows-aarch64"
        type: string
        default: linux-x86_64
  schedule:
    - cron: "23 5 * * 1"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}-${{ inputs.mode }}-${{ inputs.targets }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'test' }}
          TARGETS: ${{ github.event_name == 'workflow_dispatch' && inputs.targets || 'all' }}
        run: |
          all='[
            {"target": "linux-x86_64", "runner": "ubuntu-24.04"},
            {"target": "linux-aarch64", "runner": "ubuntu-24.04-arm"},
            {"target": "macos-aarch64", "runner": "macos-26"},
            {"target": "windows-x86_64", "runner": "windows-2025"},
            {"target": "windows-aarch64", "runner": "windows-11-arm"}
          ]'
          wanted=$(jq -cn --arg t "$TARGETS" --argjson all "$all" \
            'if $t == "all" then [$all[].target] else $t | split(",") | map(gsub("\\s"; "")) | map(select(. != "")) end')
          unknown=$(jq -cn --argjson w "$wanted" --argjson all "$all" '$w - [$all[].target]')
          if [ "$unknown" != "[]" ] || [ "$wanted" = "[]" ]; then
            echo "::error::unknown or empty targets: $TARGETS"
            exit 1
          fi
          matrix=$(jq -cn --argjson w "$wanted" --argjson all "$all" '[$all[] | select(.target as $x | $w | index($x))]')
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "mode $MODE on $matrix"

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: toolchain
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" --profile minimal --component rustfmt
      - name: cargo fmt --check
        id: fmt
        run: |
          cargo fmt --all
          for f in libraries/*/src/main.rs examples/*/src/main.rs; do
            rustfmt --edition 2024 "$f"
          done
          if git diff --quiet; then
            exit 0
          fi
          git diff > fmt.patch
          echo "differs=true" >> "$GITHUB_OUTPUT"
          exit 1
      - if: ${{ failure() && steps.fmt.outputs.differs == 'true' }}
        uses: actions/upload-artifact@v5
        with:
          name: fmt-patch-${{ github.run_number }}
          path: fmt.patch

  lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: toolchain
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" --profile minimal
      - name: Cargo.lock up to date
        id: lock
        run: |
          if cargo metadata --locked --format-version 1 > /dev/null; then
            exit 0
          fi
          cargo metadata --format-version 1 > /dev/null
          git diff --stat -- Cargo.lock
          echo "differs=true" >> "$GITHUB_OUTPUT"
          exit 1
      - if: ${{ failure() && steps.lock.outputs.differs == 'true' }}
        uses: actions/upload-artifact@v5
        with:
          name: cargo-lock-${{ github.run_number }}
          path: Cargo.lock

  component:
    runs-on: ubuntu-24.04
    env:
      WASI_SDK: wasi-sdk-34.0-x86_64-linux
      WASI_SDK_SHA256: b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4
      WIT_BINDGEN: wit-bindgen-0.62.0-x86_64-linux
      WIT_BINDGEN_SHA256: 3e81cc6523729f7532b4aa7968648a04abf0c711b7d1677150e9121f4e6458fe
    steps:
      - uses: actions/checkout@v5
      - name: wasi-sdk 34 and wit-bindgen 0.62.0, pinned by SHA-256
        run: |
          curl -sSfL -o sdk.tar.gz "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/$WASI_SDK.tar.gz"
          echo "$WASI_SDK_SHA256  sdk.tar.gz" | sha256sum -c
          curl -sSfL -o bindgen.tar.gz "https://github.com/bytecodealliance/wit-bindgen/releases/download/v0.62.0/$WIT_BINDGEN.tar.gz"
          echo "$WIT_BINDGEN_SHA256  bindgen.tar.gz" | sha256sum -c
          mkdir -p tools
          tar xzf sdk.tar.gz -C tools
          tar xzf bindgen.tar.gz -C tools
          ls tools
      - name: the C component of examples/shop
        run: |
          tools_dir="$PWD/tools"
          cd examples/shop/components
          mkdir -p build
          "$tools_dir/$WIT_BINDGEN/wit-bindgen" c tax.wit --out-dir build
          ls build
          "$tools_dir/$WASI_SDK/bin/clang" --target=wasm32-wasip2 -mexec-model=reactor -O2 -Ibuild \
            -o tax.wasm rates.c build/tax.c build/tax_component_type.o
          echo "tax.wasm: $(wc -c < tax.wasm) bytes, sha256 $(sha256sum tax.wasm | cut -d' ' -f1)"
      - uses: actions/upload-artifact@v5
        with:
          name: components
          path: examples/shop/components/tax.wasm

  check:
    needs: [plan, component]
    name: ${{ needs.plan.outputs.mode }} (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: components
          path: examples/shop/components
      - name: rustup
        run: |
          if ! command -v rustup > /dev/null; then
            if [ "${{ matrix.target }}" != windows-aarch64 ]; then
              echo "::error::no rustup on ${{ matrix.runner }}"
              exit 1
            fi
            curl -sSfL -o rustup-init.exe https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe
            ./rustup-init.exe -y --default-toolchain none --profile minimal
            echo "$USERPROFILE\\.cargo\\bin" >> "$GITHUB_PATH"
          fi
      - name: toolchain
        run: |
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" \
            --profile minimal --component rustfmt,clippy --target wasm32-wasip2,wasm32-unknown-unknown
          rustc --version
          cargo --version
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: lengua's own std-only crates, built for WebAssembly (wasm32-wasip2)
        run: cargo build --locked --target wasm32-wasip2 -p lengua-idea -p lengua-lint
      - name: tests built
        if: ${{ needs.plan.outputs.mode == 'compile' }}
        run: cargo test --workspace --locked --no-run
      - name: tests run
        if: ${{ needs.plan.outputs.mode == 'test' }}
        run: cargo test --workspace --locked --no-fail-fast
      - name: the wiki of libraries/ and examples/, written in place by check
        if: ${{ needs.plan.outputs.mode == 'wiki' }}
        run: cargo test --locked -p lengua-mcp --test wiki -- --ignored --nocapture
      - if: ${{ !cancelled() && needs.plan.outputs.mode == 'wiki' }}
        uses: actions/upload-artifact@v5
        with:
          name: wiki-${{ github.run_number }}-${{ matrix.target }}
          path: |
            index.md
            libraries/index.md
            examples/index.md
            libraries/*/idea.md
            libraries/*/ideas/**/*.md
            libraries/*/index.md
            libraries/*/log.md
            examples/*/idea.md
            examples/*/ideas/**/*.md
            examples/*/index.md
            examples/*/log.md
            examples/*/components/*.md
      - name: the imports of the built examples, as Wasmtime reads them
        if: ${{ !cancelled() && needs.plan.outputs.mode == 'test' }}
        run: |
          for f in $(find target/tmp -path '*wasm32-wasip2/release/*.wasm' -not -path '*/deps/*' -not -path '*/build/*' | sort); do
            echo "$f: $(wc -c < "$f") bytes"
            cargo run --locked -q -p lengua-mcp -- imports "$f"
          done
      - name: the function names of greet and the shop, built again without strip, to compare between systems
        if: ${{ !cancelled() && needs.plan.outputs.mode == 'test' }}
        run: |
          case "${{ matrix.target }}" in
            linux-x86_64) a=x86_64-linux; s=21c036c1740a0552124c79c6e2170cb61c5b016005671a6d5bc06cf642165431; x=tar.gz ;;
            linux-aarch64) a=aarch64-linux; s=773b5e6bf957f0d93a9a337c9c5fc4c35509706301a80799f57a76fa367fd1ca; x=tar.gz ;;
            macos-aarch64) a=aarch64-macos; s=b568f04746a699c4068b8d751779b60b501cf2cab6d259a3bc973eb5eeb1f62b; x=tar.gz ;;
            windows-x86_64) a=x86_64-windows; s=0803df158b4dbea6b029d11f4206c414f432f0447af91542817061e4f0bd912e; x=zip ;;
            windows-aarch64) a=aarch64-windows; s=e556da1f47810331f6455cb1b23248a9fa43f2fca28adb6eeb0973d4f25b7e25; x=zip ;;
          esac
          curl -sSfL -o "wt.$x" "https://github.com/bytecodealliance/wasm-tools/releases/download/v1.263.0/wasm-tools-1.263.0-$a.$x"
          if [ "$(uname)" = Darwin ]; then echo "$s  wt.$x" | shasum -a 256 -c; else echo "$s  wt.$x" | sha256sum -c; fi
          mkdir -p "$RUNNER_TEMP/wt"
          if [ "$x" = zip ]; then unzip -q "wt.$x" -d "$RUNNER_TEMP/wt"; else tar xzf "wt.$x" -C "$RUNNER_TEMP/wt"; fi
          tools=$(find "$RUNNER_TEMP/wt" -type f \( -name wasm-tools -o -name wasm-tools.exe \) | head -1)
          mkdir -p "same/${{ matrix.target }}"
          for pair in "greet target/tmp/lengua-mcp-greet/greet greet" \
                      "shop target/tmp/lengua-mcp-shop/examples/shop shop"; do
            set -- $pair
            if [ ! -f "$2/Cargo.toml" ]; then continue; fi
            cp "$2/Cargo.toml" "$RUNNER_TEMP/Cargo.toml.kept"
            sed -i.bak '/^strip = true$/d' "$2/Cargo.toml"
            (cd "$2" && RUSTC_WRAPPER="$GITHUB_WORKSPACE/target/debug/lengua-mcp" LENGUA_RUSTC_WRAPPER=1 CARGO_BUILD_PIPELINING=false cargo build -q --release --target wasm32-wasip2 --offline --target-dir "$RUNNER_TEMP/names-$1")
            cp "$RUNNER_TEMP/Cargo.toml.kept" "$2/Cargo.toml"
            rm -f "$2/Cargo.toml.bak"
            "$tools" print "$RUNNER_TEMP/names-$1/wasm32-wasip2/release/$3.wasm" | grep -E '^ *\(func ' | sed 's/ (type [0-9]*).*//' > "same/${{ matrix.target }}/$1-names.txt"
            wc -l "same/${{ matrix.target }}/$1-names.txt"
          done
      - name: the bytes of the built components, for the check that every system builds the same
        if: ${{ !cancelled() && needs.plan.outputs.mode == 'test' }}
        run: |
          mkdir -p "same/${{ matrix.target }}"
          for pair in hello:hello tally:tally greet:greet run-echo:echo run-count:count run-files:files run-clock:clock run-forever:forever run-greedy:greedy run-words:words fetch:fetch upper:upper sleepy:sleepy; do
            test_name=${pair%%:*}
            name=${pair#*:}
            set -- "$name" "target/tmp/lengua-mcp-$test_name/$name/target/wasm32-wasip2/release/$name.wasm"
            if [ -f "$2" ]; then
              cp "$2" "same/${{ matrix.target }}/$1.wasm"
            fi
          done
          for pair in "shop target/tmp/lengua-mcp-shop/examples/shop/target/wasm32-wasip2/release/shop.wasm"; do
            set -- $pair
            if [ -f "$2" ]; then
              cp "$2" "same/${{ matrix.target }}/$1.wasm"
            fi
          done
          ls -l "same/${{ matrix.target }}"
          cd "same/${{ matrix.target }}" && (sha256sum *.wasm 2> /dev/null || shasum -a 256 *.wasm) | tee sums.txt
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() && needs.plan.outputs.mode == 'test' }}
        with:
          name: built-${{ matrix.target }}
          path: same
          if-no-files-found: ignore
      - name: the shared libraries, checked by the tests, built for wasm32-unknown-unknown too
        if: ${{ !cancelled() && needs.plan.outputs.mode == 'test' }}
        run: |
          found=0
          for d in target/tmp/lengua-mcp-lib-*/libraries/*/; do
            if [ ! -f "$d/Cargo.toml" ]; then
              continue
            fi
            found=$((found + 1))
            echo "== $d"
            (cd "$d" && cargo build -q --release --target wasm32-unknown-unknown --offline)
            ls -l "$d"target/wasm32-unknown-unknown/release/*.rlib
          done
          echo "$found shared libraries built for wasm32-unknown-unknown"
          test "$found" -ge 7
      - name: the time of each check, from the first call to the end of its job
        if: ${{ !cancelled() && needs.plan.outputs.mode == 'test' }}
        run: |
          if [ -f target/tmp/lengua-timings.txt ]; then
            sort target/tmp/lengua-timings.txt
          else
            echo "no timings"
          fi
      - name: the time clippy adds to the build of hello world
        if: ${{ !cancelled() && needs.plan.outputs.mode == 'test' }}
        run: |
          d=target/tmp/lengua-mcp-hello/hello
          if [ ! -f "$d/Cargo.toml" ]; then
            echo "no built hello world"
            exit 0
          fi
          cd "$d"
          cargo clean -q
          TIMEFORMAT='fmt --check: %R s'
          time cargo fmt --check
          TIMEFORMAT='clippy, from clean: %R s'
          time cargo clippy -q --release --target wasm32-wasip2 --offline -- -D warnings
          TIMEFORMAT='build, after clippy: %R s'
          time cargo build -q --release --target wasm32-wasip2 --offline
          cargo clean -q
          TIMEFORMAT='build alone, from clean: %R s'
          time cargo build -q --release --target wasm32-wasip2 --offline
      - name: lengua-run built alone, with no compiler in it
        run: |
          tree=$(cargo tree --locked -p lengua-run -e normal --prefix none | sort -u)
          echo "the crates of lengua-run named cranelift (the data structures Wasmtime's runtime uses):"
          echo "$tree" | grep -i cranelift || echo "none"
          if echo "$tree" | grep -E "^(cranelift-codegen|cranelift-frontend|cranelift-native|wasmtime-internal-cranelift|wasmtime-internal-winch|winch-codegen) "; then
            echo "::error::lengua-run has a compiler in it"
            exit 1
          fi
          cargo build --release --locked -p lengua-run
          ./target/release/lengua-run --version
      - name: lengua-mcp built
        run: |
          cargo build --release --locked -p lengua-mcp
          ./target/release/lengua-mcp --version
      - name: the size and the start-up of lengua-run and of lengua-mcp
        if: ${{ !cancelled() && needs.plan.outputs.mode == 'test' }}
        run: |
          exe=""
          if [ -f target/release/lengua-run.exe ]; then
            exe=.exe
          fi
          for b in lengua-run lengua-mcp; do
            echo "$b: $(wc -c < "target/release/$b$exe") bytes"
          done
          h=target/tmp/lengua-mcp-lengua-run-hello/hello
          if [ ! -f "$h/lengua.lock" ]; then
            echo "no checked hello world"
            exit 0
          fi
          export LENGUA_HOME=target/tmp/lengua-home
          ./target/release/lengua-run "$h"
          ./target/release/lengua-mcp worker program "$h/lengua.lock" "$h" "$h" live < /dev/null | head -c 200
          echo
          TIMEFORMAT='lengua-run, hello world, 20 runs: %R s'
          time (for i in $(seq 20); do ./target/release/lengua-run "$h" > /dev/null; done)
          TIMEFORMAT='lengua-mcp worker, hello world, 20 runs: %R s'
          time (for i in $(seq 20); do ./target/release/lengua-mcp worker program "$h/lengua.lock" "$h" "$h" live < /dev/null > /dev/null; done)
          TIMEFORMAT='lengua-run --version, 20 runs: %R s'
          time (for i in $(seq 20); do ./target/release/lengua-run --version > /dev/null; done)
          TIMEFORMAT='lengua-mcp --version, 20 runs: %R s'
          time (for i in $(seq 20); do ./target/release/lengua-mcp --version > /dev/null; done)

  same-bytes:
    needs: [plan, check]
    if: ${{ !cancelled() && needs.plan.outputs.mode == 'test' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: built-*
          merge-multiple: true
          path: built
      - name: wasm-tools 1.263.0, pinned by SHA-256, to show what differs
        run: |
          curl -sSfL -o wt.tar.gz https://github.com/bytecodealliance/wasm-tools/releases/download/v1.263.0/wasm-tools-1.263.0-x86_64-linux.tar.gz
          echo "21c036c1740a0552124c79c6e2170cb61c5b016005671a6d5bc06cf642165431  wt.tar.gz" | sha256sum -c
          tar xzf wt.tar.gz
          echo "$PWD/wasm-tools-1.263.0-x86_64-linux" >> "$GITHUB_PATH"
      - name: every built example has the same SHA-256 on every system
        run: |
          ls built
          status=0
          for name in hello tally greet echo count files clock forever greedy words fetch upper sleepy shop; do
            echo "== $name"
            first=""
            for dir in built/*/; do
              dir=${dir%/}
              file="$dir/$name.wasm"
              if [ ! -f "$file" ]; then
                echo "$(basename "$dir"): not built"
                status=1
                continue
              fi
              echo "$(basename "$dir"): $(wc -c < "$file") bytes, $(sha256sum "$file" | cut -d' ' -f1)"
              if [ -z "$first" ]; then
                first="$file"
              elif ! cmp -s "$first" "$file"; then
                status=1
                echo "  differs from $(basename "$(dirname "$first")"): $(cmp -l "$first" "$file" | wc -l) bytes differ; the first differences:"
                cmp -l "$first" "$file" | head -20 || true
                diff <(wasm-tools print "$first") <(wasm-tools print "$file") | head -60 || true
              fi
            done
          done
          exit $status
      - name: the function names of greet and the shop, compared between systems
        if: ${{ !cancelled() }}
        run: |
          for name in greet shop; do
            first=""
            for dir in built/*/; do
              file="${dir%/}/$name-names.txt"
              [ -f "$file" ] || continue
              if [ -z "$first" ]; then first="$file"; continue; fi
              if ! cmp -s "$first" "$file"; then
                echo "== $name: $first and $file"
                diff "$first" "$file" | head -60 || true
              fi
            done
          done
