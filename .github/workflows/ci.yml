name: ci

# lengua built and tested natively on five runners, GitHub's free ones (the repository is public):
# Linux on x86-64 and ARM64, macOS on ARM64 (Apple stopped making Intel Macs), and Windows on
# x86-64 and ARM64, each running the same WebAssembly programs.
# scripts/ci/targets.json names the five runners; scripts/ci/tools.tsv pins what they install;
# scripts/ci/setup.sh installs it.
#
# - A push to a branch runs the suite on all five (a branch named wip/... gets no push run: its
#   author dispatches the run it wants, so work in progress doesn't cost a long suite per push).
# - Every week it runs the suite, the slow ignored tests and the bench on all five.
# - A dispatch picks the targets and the mode: compile (clippy and the tests built), test (the
#   suite), ignored (the slow ignored tests, optionally one folder's check), golden (the checker's
#   and the prover's recordings of every program, made at two commits and compared), bench (the
#   gate: lengua against C, C++ and Rust compiled to WebAssembly and built natively, and against
#   an earlier commit's programs) or release (each runner's archive, built there, then installed
#   and checked on a clean runner of the same system and CPU).
# - A bench's C, C++ and Rust are compiled to WebAssembly once, by the bench-wasm job on
#   linux-x86_64, and every runner's bench measures those same modules.
# - `filter` matches test *names* only (libtest's filters, after `--`). To run a test *file*, name
#   it in `test_files` (`lib` is the library's own tests): each becomes `--test <name>`. A run with
#   a filter or files that matched no test fails, so a gate cannot pass by running nothing.
on:
  push:
    branches-ignore:
      - "wip/**"
    paths:
      - "src/**"
      - "tests/**"
      - "crates/**"
      - "plugin/**"
      - "benches/**"
      - "examples/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/**"
      - ".github/**"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      targets:
        description: "Which targets: all, or a comma-separated list from scripts/ci/targets.json"
        type: string
        default: "all"
      mode:
        description: "compile, test, ignored, golden, bench or release (golden: on linux-x86_64 alone; bench and release: all five)"
        type: choice
        options:
          - compile
          - test
          - ignored
          - golden
          - bench
          - release
        default: compile
      filter:
        description: "Only the tests whose names contain this (libtest's filters: several, separated by spaces)"
        type: string
        default: ""
      test_files:
        description: "Only these test files, by name, separated by spaces (wasm_limits wasm_red_team ...; lib for the library's own tests)"
        type: string
        default: ""
      check_folder:
        description: "Program folders, comma-separated, for the ignored check_one_folder test (LENGUA_CHECK_FOLDER)"
        type: string
        default: ""
      mutate_only:
        description: "The programs the mutation test runs alone (LENGUA_MUTATE_ONLY), in an ignored run"
        type: string
        default: ""
      stall_seconds:
        description: "Stop a test or ignored run after this many seconds, keeping where it stood (stall.txt; the two Linux targets)"
        type: string
        default: ""
      seed:
        description: "The seed the randomized tests draw from (LENGUA_RANDOM_SEED), to run one again"
        type: string
        default: ""
      golden_base:
        description: "golden: the commit to record the goldens at, to compare the dispatched ref's with"
        type: string
        default: ""
      golden_base_run:
        description: "golden: an earlier golden run whose base recordings to reuse, instead of recording the base again"
        type: string
        default: ""
      golden_view:
        description: "golden: raw (the recordings byte for byte) or ledger (only the proofs' verdicts, counts left out)"
        type: choice
        options:
          - raw
          - ledger
        default: raw
      bench_against:
        description: "bench: a commit whose lengua programs the dispatched ref's are measured against, in the same run"
        type: string
        default: ""

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}-${{ inputs.mode }}-${{ inputs.targets }}-${{ inputs.filter }}-${{ inputs.test_files }}-${{ inputs.check_folder }}-${{ inputs.mutate_only }}-${{ inputs.golden_base }}-${{ inputs.golden_base_run }}-${{ inputs.golden_view }}-${{ inputs.bench_against }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  # The jobs to run, as a matrix, from the one list of runners: each target in each mode.
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      bench: ${{ steps.matrix.outputs.bench }}
    steps:
      - uses: actions/checkout@v4

      - id: matrix
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          TARGETS: ${{ inputs.targets }}
          GOLDEN_BASE: ${{ inputs.golden_base }}
          GOLDEN_BASE_RUN: ${{ inputs.golden_base_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # A push runs the suite, the weekly run the suite, the ignored tests and the bench, a
          # dispatch what it asks.
          case "$EVENT" in
            push) modes='["test"]'; TARGETS=all; MODE=test ;;
            schedule) modes='["test","ignored","bench"]'; TARGETS=all; MODE=test ;;
            *) modes="[\"$MODE\"]" ;;
          esac
          TARGETS="${TARGETS// /}"
          listed=$(jq -c '.' scripts/ci/targets.json)
          if [ -z "$TARGETS" ] || [ "$TARGETS" = all ]; then
            include="$listed"
          else
            include=$(jq -c --arg t ",$TARGETS," \
              '[.[] | . as $e | select($t | contains("," + $e.target + ","))]' <<< "$listed")
          fi
          # The bench and the release archive run on all five; the goldens' legs are made below.
          # A job's checkout is shallow unless it must read other commits: a bench holds each change
          # to KNOWN_BEHIND in the history to the list before it (the list may only shrink), and
          # reads any commit it is measured against. The weekly run's bench leg too.
          matrix=$(jq -c --argjson modes "$modes" \
            '[.[] as $t | $modes[] as $m | $t + {mode: $m, ref: "", label: "", depth: (if $m == "bench" then 0 else 1 end)}]' <<< "$include")
          if [ "$MODE" = golden ]; then
            # The goldens: the dispatched ref and, unless an earlier run's are reused, the base,
            # each recorded on its own runner so that the two legs run at once. The recordings are
            # the checker's and the prover's, which one x86-64 host makes.
            if [ -z "$GOLDEN_BASE" ] && [ -z "$GOLDEN_BASE_RUN" ]; then
              echo "golden needs golden_base (a commit) or golden_base_run (an earlier golden run)" >&2
              exit 1
            fi
            legs='[{"label":"head","ref":""}]'
            if [ -z "$GOLDEN_BASE_RUN" ]; then
              # actions/checkout takes a branch, a tag or a full commit hash, never a short one.
              full=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GOLDEN_BASE" --jq .sha)
              legs=$(jq -c --arg r "$full" '. + [{label: "base", ref: $r}]' <<< "$legs")
            fi
            matrix=$(jq -c --argjson legs "$legs" \
              '[.[] | select(.target == "linux-x86_64") as $t | $legs[] | $t + . + {mode: "golden", depth: 0}]' <<< "$listed")
          fi
          if [ "$matrix" = "[]" ]; then
            echo "Nothing to run for: $TARGETS in $MODE" >&2
            exit 1
          fi
          echo "matrix={\"include\":$matrix}" >> "$GITHUB_OUTPUT"
          # Whether a bench runs, which needs the WebAssembly builds of C, C++ and Rust.
          echo "bench=$(jq -r 'any(.[]; .mode == "bench")' <<< "$matrix")" >> "$GITHUB_OUTPUT"

  # Formatting is the same on every target, so it is checked once, beside the tests rather than in
  # front of them: a difference never hides a test result. When there is one, the patch that
  # formats it is kept (fmt.patch), to apply with git.
  format:
    name: format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: bash scripts/ci/setup.sh linux-x86_64 rust

      - name: Format
        run: |
          if ! cargo fmt --check; then
            cargo fmt
            git diff > fmt.patch
            exit 1
          fi

      - name: Keep the patch
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fmt-patch-${{ github.run_number }}
          path: fmt.patch
          retention-days: 7
          if-no-files-found: ignore

      # Nothing builds on the owner's computer, so a new dependency's lock entries are made here:
      # when Cargo.lock is behind Cargo.toml, the resolved Cargo.lock is kept (cargo-lock), to copy
      # into the repository, and the job fails.
      - name: Lock file
        if: ${{ !cancelled() }}
        run: |
          if ! cargo metadata --locked --format-version 1 > /dev/null; then
            cargo metadata --format-version 1 > /dev/null
            mkdir -p lock && cp Cargo.lock lock/Cargo.lock
            exit 1
          fi

      - name: Keep the lock file
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock-${{ github.run_number }}
          path: lock/Cargo.lock
          retention-days: 7
          if-no-files-found: ignore

  # A bench's C, C++ and Rust compiled to WebAssembly once, with wasi-sdk (pinned in tools.tsv)
  # and Rust's wasm32-wasip1 target, and kept for every runner's bench, which measures the same
  # modules (scripts/ci/bench-wasm.sh). It runs only when a bench does.
  bench-wasm:
    name: bench-wasm
    needs: plan
    if: ${{ needs.plan.outputs.bench == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/wasi-sdk
          key: wasi-sdk-${{ hashFiles('scripts/ci/tools.tsv') }}

      - name: Rust, wasi-sdk and Rust's wasm32-wasip1 target
        run: bash scripts/ci/setup.sh linux-x86_64 rust wasi

      - name: The modules
        run: bash scripts/ci/bench-wasm.sh target/bench-wasm

      # A run's every attempt keeps one set, the last built.
      - name: Keep the modules
        uses: actions/upload-artifact@v4
        with:
          name: bench-wasm-${{ github.run_number }}
          path: target/bench-wasm
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  test:
    name: ${{ matrix.mode }} (${{ matrix.target }})${{ matrix.label && format(' {0}', matrix.label) || '' }}
    # A bench needs the WebAssembly builds; every other job only waits for bench-wasm to be
    # skipped, and none runs when it failed.
    needs: [plan, bench-wasm]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.bench-wasm.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    # A golden leg, the mutation test and the bench run longer than the suite: the first golden
    # head leg (run 42152180357) was cut off at 120 minutes, where its base leg took 101.
    timeout-minutes: ${{ (matrix.mode == 'test' || matrix.mode == 'compile') && 120 || 330 }}
    defaults:
      run:
        shell: bash
    steps:
      # A golden base leg checks out the base commit; the others, the dispatched ref.
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: ${{ matrix.depth }}

      # The base predates some of the scripts the steps below run (a base leg needs the full
      # history, which brings the dispatched commit with it), so the leg runs the base's code with
      # the dispatched ref's scripts.
      - name: The dispatched ref's scripts
        if: ${{ matrix.ref != '' }}
        run: git checkout ${{ github.sha }} -- scripts

      - name: The machine
        run: bash scripts/ci/machine.sh ${{ matrix.target }}

      - name: Rust
        run: bash scripts/ci/setup.sh ${{ matrix.target }} rust

      # The solvers are kept between runs. A release doesn't need them: the archive brings its own,
      # which scripts/release.sh fetches as tools.tsv pins them.
      - uses: actions/cache@v4
        if: ${{ matrix.mode != 'compile' && matrix.mode != 'release' }}
        with:
          path: ~/solvers
          key: tools-${{ matrix.target }}-${{ hashFiles('scripts/ci/tools.tsv', 'scripts/ci/setup.sh') }}

      - name: z3 and cvc5, pinned by checksum
        if: ${{ matrix.mode != 'compile' && matrix.mode != 'release' }}
        run: bash scripts/ci/setup.sh ${{ matrix.target }} solvers

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'scripts/ci/setup.sh') }}
          restore-keys: ci-${{ matrix.target }}-

      # --keep-going: every target's errors in one run, not the first target's alone. A release
      # is built from a commit whose suite already ran.
      - name: Clippy
        if: ${{ matrix.mode != 'golden' && matrix.mode != 'release' }}
        run: cargo clippy --release --all-targets --locked --workspace --keep-going -- -D warnings

      # Built first, so that the time a test run may take (stall_seconds) is the tests' and not the
      # compiler's.
      - name: Build the tests
        if: ${{ matrix.mode == 'compile' || matrix.mode == 'test' || matrix.mode == 'ignored' }}
        run: cargo test --release --locked --workspace --no-run

      - name: Tests
        if: ${{ matrix.mode == 'test' }}
        env:
          LENGUA_PROOF_SECONDS: "60"
          RUST_TEST_THREADS: "2"
          FILTER: ${{ inputs.filter }}
          TEST_FILES: ${{ inputs.test_files }}
          LENGUA_RANDOM_SEED: ${{ inputs.seed }}
          STALL_SECONDS: ${{ inputs.stall_seconds }}
          LENGUA_SKIP_LOG: ${{ github.workspace }}/skips.log
        run: |
          selection=$(bash scripts/ci/test-selection.sh $TEST_FILES)
          tests='set -o pipefail; cargo test --release --locked --workspace --no-fail-fast '"$selection"' -- $FILTER 2>&1 | tee test.log'
          if [ -n "$STALL_SECONDS" ]; then
            bash scripts/stall-report.sh "$STALL_SECONDS" bash -c "$tests"
          else
            bash -c "$tests"
          fi
          bash scripts/ci/ran-some-tests.sh test.log "$FILTER$TEST_FILES"

      - name: The slow ignored tests
        if: ${{ matrix.mode == 'ignored' }}
        env:
          LENGUA_PROOF_SECONDS: "60"
          RUST_TEST_THREADS: "2"
          FILTER: ${{ inputs.filter }}
          TEST_FILES: ${{ inputs.test_files }}
          LENGUA_RANDOM_SEED: ${{ inputs.seed }}
          LENGUA_CHECK_FOLDER: ${{ inputs.check_folder }}
          LENGUA_MUTATE_ONLY: ${{ inputs.mutate_only }}
          STALL_SECONDS: ${{ inputs.stall_seconds }}
          LENGUA_SKIP_LOG: ${{ github.workspace }}/skips.log
        run: |
          selection=$(bash scripts/ci/test-selection.sh $TEST_FILES)
          tests='set -o pipefail; cargo test --release --locked --workspace --no-fail-fast '"$selection"' -- --ignored --nocapture $FILTER 2>&1 | tee ignored.log'
          if [ -n "$STALL_SECONDS" ]; then
            bash scripts/stall-report.sh "$STALL_SECONDS" bash -c "$tests"
          else
            bash -c "$tests"
          fi
          bash scripts/ci/ran-some-tests.sh ignored.log "$FILTER$TEST_FILES"

      # The checker's and the prover's reports on every program, recorded. target/ is cached
      # whole, the recordings included, so they go first: a restored old recording would be
      # compared with silently. One test at a time: the prover's recordings run under fixed time
      # budgets, and tests run side by side would make "out of time" differ between the two legs.
      # (The two filters are the two goldens' tests; the helper explains_a_mutant matches neither.)
      - name: The goldens, recorded
        if: ${{ matrix.mode == 'golden' }}
        env:
          RUST_TEST_THREADS: "1"
          LENGUA_SKIP_LOG: ${{ github.workspace }}/skips.log
        run: |
          rm -rf target/golden
          set -o pipefail
          LENGUA_GOLDEN=write cargo test --release --locked --lib -- --ignored \
            every_report_is_as_recorded every_run_and_proof_is_as_recorded 2>&1 | tee golden.log
          bash scripts/ci/ran-some-tests.sh golden.log goldens
          ls -l target/golden

      - name: The recordings, kept
        if: ${{ matrix.mode == 'golden' }}
        uses: actions/upload-artifact@v4
        with:
          name: golden-${{ matrix.label }}-${{ matrix.ref || github.sha }}
          path: target/golden/*.txt
          retention-days: 30

      - name: The WebAssembly builds of C, C++ and Rust
        if: ${{ matrix.mode == 'bench' }}
        uses: actions/download-artifact@v4
        with:
          name: bench-wasm-${{ github.run_number }}
          path: ${{ runner.temp }}/bench-wasm

      # The gate (benches/against_rust_and_c.rs): it fails where the run and KNOWN_BEHIND
      # disagree, and writes BENCHMARKS-<target>.md from the run's results, which are kept below.
      # Windows builds the native C and C++ with the image's LLVM clang.
      - name: The gate against C, C++ and Rust
        if: ${{ matrix.mode == 'bench' }}
        env:
          LENGUA_BENCH_AGAINST: ${{ inputs.bench_against }}
          LENGUA_BENCH_WASM: ${{ runner.temp }}/bench-wasm
        run: |
          if [ -d "/c/Program Files/LLVM/bin" ]; then
            export PATH="$PATH:/c/Program Files/LLVM/bin"
          fi
          cargo bench --locked --bench against_rust_and_c 2>&1 | tee bench.log

      - name: The report, in the summary
        if: ${{ always() && matrix.mode == 'bench' }}
        env:
          REPORT: BENCHMARKS-${{ matrix.target }}.md
        run: |
          if [ -f "$REPORT" ]; then cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"; fi

      # This runner's archive (scripts/release.sh), and the release check built beside it, to run
      # where the archive is installed, on a runner that builds nothing.
      - name: The release archive
        id: release
        if: ${{ matrix.mode == 'release' }}
        run: |
          bash scripts/release.sh ${{ matrix.target }}
          echo "version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: The release check, built
        if: ${{ matrix.mode == 'release' }}
        run: |
          cargo test --release --locked --test release_check --no-run --message-format=json > release-check.json
          # The test binary's path, from the artifact message that names it (Windows's with its
          # backslashes escaped).
          built=$(grep '"name":"release_check"' release-check.json | grep -o '"executable":"[^"]*"' \
            | head -n 1 | sed 's/^"executable":"//; s/"$//; s/\\\\/\\/g') || true
          if [ -z "$built" ]; then
            echo "cargo built no release check" >&2
            exit 1
          fi
          mkdir -p dist/check
          case "${{ matrix.target }}" in
            windows-*) cp "$(cygpath -u "$built")" dist/check/release-check.exe ;;
            *) cp "$built" dist/check/release-check ;;
          esac

      # The archive, named with its version, system and CPU; it is kept nowhere else.
      - name: Keep the archive
        if: ${{ matrix.mode == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: lengua-${{ steps.release.outputs.version }}-${{ matrix.target }}
          path: |
            dist/lengua-*.tar.gz
            dist/lengua-*.zip
            dist/lengua-*.sha256
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      - name: Keep the release check
        if: ${{ matrix.mode == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-check-${{ matrix.target }}
          path: dist/check/
          retention-days: 7
          if-no-files-found: error

      # A green run says what it did not cover: libtest hides what a passing test prints, so a
      # test that skips itself notes why (lengua::skiplog) and the notes are counted here.
      - name: What the tests skipped
        if: always()
        run: bash scripts/skip-summary.sh skips.log | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the logs and the server
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-${{ matrix.target }}-${{ matrix.mode }}${{ matrix.label && format('-{0}', matrix.label) || '' }}-${{ github.run_number }}
          path: |
            test.log
            ignored.log
            golden.log
            skips.log
            stall.txt
            bench.log
            BENCHMARKS-*.md
            target/bench/results-*.json
            target/bench/KNOWN_BEHIND-*.txt
            target/release/lengua-mcp
            target/release/lengua-mcp.exe
          retention-days: 7
          if-no-files-found: ignore

  # The goldens recorded at the dispatched ref and at the base, compared: byte for byte (raw) or
  # as the proofs' verdicts alone (ledger); see scripts/ci/golden-diff.sh.
  golden-diff:
    name: golden diff
    needs: test
    if: ${{ always() && inputs.mode == 'golden' && needs.test.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: The recordings of both commits
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_id }}
          BASE_RUN: ${{ inputs.golden_base_run }}
        run: |
          gh run download "$RUN" --pattern 'golden-head-*' --dir golden/head
          # The base's: from this run, or from an earlier one whose recordings are reused.
          gh run download "${BASE_RUN:-$RUN}" --pattern 'golden-base-*' --dir golden/base

      # `shell: bash` runs with pipefail, so that the script's exit decides the job and not tee's.
      - name: Compare
        shell: bash
        env:
          VIEW: ${{ inputs.golden_view }}
        run: bash scripts/ci/golden-diff.sh "$VIEW" golden/base golden/head | tee -a "$GITHUB_STEP_SUMMARY"

  # Each runner's release archive installed on a clean runner of its own system and CPU, as a
  # user installs it: nothing of lengua's set up first (no checkout, no Rust, no solvers), the
  # archive checked against its SHA-256 and unpacked in a fresh folder, installed by its own
  # install script (Windows PowerShell's on Windows) where it installs for any user, then
  # lengua-mcp doctor, and the release check, tests/release_check.rs built beside the archive,
  # through a plain MCP client. Doctor and the check run with PATH cut to the system's own
  # folders, so that nothing the runner's image adds there (Git for Windows' MinGW libraries,
  # say) stands in for a library the archive should ship. The install script must also refuse
  # to replace a folder that isn't lengua's, with --prefix.
  install:
    name: install (${{ matrix.target }})
    needs: [plan, test]
    if: ${{ always() && inputs.mode == 'release' && needs.test.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: The archive and the release check
        uses: actions/download-artifact@v4
        with:
          pattern: "*-${{ matrix.target }}"
          path: downloaded
          merge-multiple: true

      - name: Unpacked in a fresh folder
        run: |
          temp="$RUNNER_TEMP"
          if [ "$RUNNER_OS" = Windows ]; then temp=$(cygpath -u "$RUNNER_TEMP"); fi
          cd downloaded
          ls -l
          archive=$(ls lengua-*.tar.gz lengua-*.zip 2> /dev/null | head -n 1) || true
          if [ -z "$archive" ]; then
            echo "no archive was downloaded" >&2
            exit 1
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum -c "$archive.sha256"
          else
            shasum -a 256 -c "$archive.sha256"
          fi
          mkdir -p "$temp/unpacked"
          case "$archive" in
            *.zip)
              powershell -NoProfile -Command "Expand-Archive -LiteralPath '$(cygpath -w "$PWD/$archive")' -DestinationPath '$(cygpath -w "$temp/unpacked")'"
              ;;
            *) tar -C "$temp/unpacked" -xzf "$archive" ;;
          esac
          name=${archive%.tar.gz}
          name=${name%.zip}
          echo "UNPACKED=$temp/unpacked/$name" >> "$GITHUB_ENV"
          # Where the install script puts the plugin for any user: lengua's own marketplace
          # folder, in the user's data folder.
          case "$RUNNER_OS" in
            Windows) installed="$(cygpath -u "$LOCALAPPDATA")/lengua/plugins/lengua" ;;
            macOS) installed="$HOME/Library/Application Support/lengua/plugins/lengua" ;;
            *) installed="${XDG_DATA_HOME:-$HOME/.local/share}/lengua/plugins/lengua" ;;
          esac
          echo "INSTALLED=$installed" >> "$GITHUB_ENV"
          # The system's own folders, and no others, for the programs the archive ships.
          if [ "$RUNNER_OS" = Windows ]; then
            windows=$(cygpath -u "${SYSTEMROOT:-C:\\Windows}")
            echo "BARE_PATH=$windows/System32:$windows" >> "$GITHUB_ENV"
          else
            echo "BARE_PATH=/usr/bin:/bin" >> "$GITHUB_ENV"
          fi
          ls -la "$temp/unpacked/$name"

      # --prefix (-Prefix) names lengua's marketplace folder: a lengua folder there that isn't
      # an earlier install stays as it was, and the install fails.
      - name: A folder that isn't lengua's, kept
        run: |
          temp="$RUNNER_TEMP"
          if [ "$RUNNER_OS" = Windows ]; then temp=$(cygpath -u "$RUNNER_TEMP"); fi
          mkdir -p "$temp/someone/lengua"
          echo mine > "$temp/someone/lengua/notes.txt"
          if [ "$RUNNER_OS" = Windows ]; then
            if powershell -NoProfile -ExecutionPolicy Bypass -File "$(cygpath -w "$UNPACKED/install.ps1")" \
              -Prefix "$(cygpath -w "$temp/someone")"; then
              echo "install.ps1 replaced a lengua folder that wasn't lengua's" >&2
              exit 1
            fi
          elif "$UNPACKED/install.sh" --prefix="$temp/someone"; then
            echo "install.sh replaced a lengua folder that wasn't lengua's" >&2
            exit 1
          fi
          test "$(cat "$temp/someone/lengua/notes.txt")" = mine

      # The install script ends with lengua-mcp doctor, whose exit code it keeps.
      - name: Installed with its install script
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            powershell -NoProfile -ExecutionPolicy Bypass -File "$(cygpath -w "$UNPACKED/install.ps1")"
          else
            "$UNPACKED/install.sh"
          fi
          ls -la "$INSTALLED"

      - name: lengua-mcp doctor
        run: |
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then exe=".exe"; fi
          PATH="$BARE_PATH" "$INSTALLED/server/lengua-mcp$exe" doctor

      - name: The release check, through a plain MCP client
        run: |
          exe=""
          plugin="$INSTALLED"
          if [ "$RUNNER_OS" = Windows ]; then
            exe=".exe"
            plugin=$(cygpath -w "$INSTALLED")
          fi
          check="downloaded/release-check$exe"
          chmod +x "$check"
          PATH="$BARE_PATH" LENGUA_RELEASE="$plugin" "$check" --ignored --exact \
            the_archive_works_as_a_user_gets_it --nocapture 2>&1 | tee release-check.log
          # It ran, rather than noting it had no archive.
          grep -q "^release check: ${{ matrix.target }} passed" release-check.log

      - name: Keep the release check's log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-log-${{ matrix.target }}-${{ github.run_number }}
          path: release-check.log
          retention-days: 7
          if-no-files-found: ignore

  # One check that says whether the whole run passed.
  gate:
    name: gate
    needs: [plan, format, bench-wasm, test, golden-diff, install]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ needs.plan.result }} ${{ needs.format.result }} ${{ needs.test.result }}
          GOLDEN_DIFF: ${{ needs.golden-diff.result }}
          BENCH_WASM: ${{ needs.bench-wasm.result }}
          INSTALL: ${{ needs.install.result }}
        run: |
          echo "plan, format, test: $RESULTS; golden diff: $GOLDEN_DIFF; bench-wasm: $BENCH_WASM; install: $INSTALL"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
          # It runs in the golden mode only, and bench-wasm when a bench runs.
          [ "$GOLDEN_DIFF" = success ] || [ "$GOLDEN_DIFF" = skipped ] || exit 1
          [ "$BENCH_WASM" = success ] || [ "$BENCH_WASM" = skipped ] || exit 1
          # It runs in the release mode only.
          [ "$INSTALL" = success ] || [ "$INSTALL" = skipped ] || exit 1
