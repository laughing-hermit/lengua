name: ci

# lengua built and tested natively on all six targets, on GitHub's free runners (the repository is
# public): Linux, macOS and Windows, each on x86-64 and ARM64. scripts/ci/targets.json names the six
# runners; scripts/ci/tools.tsv pins what they install; scripts/ci/setup.sh installs it.
#
# - A push to a branch runs the suite on all six (a branch named wip/... gets no push run: its
#   author dispatches the run it wants, so work in progress doesn't cost a long suite per push).
# - Every week it runs the suite and the slow ignored tests on all six.
# - A dispatch picks the targets and the mode: compile (clippy and the tests built), test (the
#   suite), ignored (the slow ignored tests, optionally one folder's check), bench (lengua against
#   C, C++ and Rust) or release (the archive). A test run also has a job on x86-64 Linux with
#   QEMU's user mode, so the ARM64 cells run there too, as on a developer's x86-64 computer.
on:
  push:
    branches-ignore:
      - "wip/**"
    paths:
      - "src/**"
      - "tests/**"
      - "crates/**"
      - "plugin/**"
      - "benches/**"
      - "examples/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/**"
      - ".github/**"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      targets:
        description: "Which targets: all, or a comma-separated list from scripts/ci/targets.json (and qemu)"
        type: string
        default: "all"
      mode:
        description: "compile, test, ignored, bench (Linux) or release (Linux)"
        type: choice
        options:
          - compile
          - test
          - ignored
          - bench
          - release
        default: compile
      filter:
        description: "Only the tests whose names contain this (libtest's filters: several, separated by spaces)"
        type: string
        default: ""
      check_folder:
        description: "Program folders, comma-separated, for the ignored check_one_folder test (LENGUA_CHECK_FOLDER)"
        type: string
        default: ""
      check_target:
        description: "The target to check them as (LENGUA_CHECK_TARGET), when not the runner's own: through QEMU"
        type: string
        default: ""
      stall_seconds:
        description: "Stop a test or ignored run after this many seconds, keeping where it stood (stall.txt; Linux)"
        type: string
        default: ""
      seed:
        description: "The seed the randomized tests draw from (LENGUA_RANDOM_SEED), to run one again"
        type: string
        default: ""

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}-${{ inputs.mode }}-${{ inputs.targets }}-${{ inputs.filter }}-${{ inputs.check_folder }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  # The jobs to run, as a matrix, from the one list of runners: each target in each mode.
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - id: matrix
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          TARGETS: ${{ inputs.targets }}
        run: |
          # A push runs the suite, the weekly run the suite and the ignored tests, a dispatch what it asks.
          case "$EVENT" in
            push) modes='["test"]'; TARGETS=all; MODE=test ;;
            schedule) modes='["test","ignored"]'; TARGETS=all; MODE=test ;;
            *) modes="[\"$MODE\"]" ;;
          esac
          TARGETS="${TARGETS// /}"
          listed=$(jq -c '.' scripts/ci/targets.json)
          if [ -z "$TARGETS" ] || [ "$TARGETS" = all ]; then
            include="$listed"
          else
            include=$(jq -c --arg t ",$TARGETS," \
              '[.[] | . as $e | select($t | contains("," + $e.target + ","))]' <<< "$listed")
          fi
          # The benchmarks and the release archive are Linux's so far.
          case "$MODE" in
            bench|release) include=$(jq -c '[.[] | select(.target | startswith("linux-"))]' <<< "$include") ;;
          esac
          matrix=$(jq -c --argjson modes "$modes" \
            '[.[] as $t | $modes[] as $m | $t + {mode: $m, base: $t.target, qemu: false}]' <<< "$include")
          # The suite on x86-64 Linux with QEMU's user mode, beside the six.
          if [ "$MODE" = test ] && { [ -z "$TARGETS" ] || [ "$TARGETS" = all ] || [[ ",$TARGETS," == *,qemu,* ]]; }; then
            matrix=$(jq -c '. + [{target: "linux-x86_64-qemu", runner: "ubuntu-24.04", mode: "test", base: "linux-x86_64", qemu: true}]' <<< "$matrix")
          fi
          if [ "$matrix" = "[]" ]; then
            echo "Nothing to run for: $TARGETS in $MODE" >&2
            exit 1
          fi
          echo "matrix={\"include\":$matrix}" >> "$GITHUB_OUTPUT"

  # Formatting is the same on every target, so it is checked once, beside the tests rather than in
  # front of them: a difference never hides a test result. When there is one, the patch that
  # formats it is kept (fmt.patch), to apply with git.
  format:
    name: format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: bash scripts/ci/setup.sh linux-x86_64 rust

      - name: Format
        run: |
          if ! cargo fmt --check; then
            cargo fmt
            git diff > fmt.patch
            exit 1
          fi

      - name: Keep the patch
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fmt-patch-${{ github.run_number }}
          path: fmt.patch
          retention-days: 7
          if-no-files-found: ignore

  test:
    name: ${{ matrix.mode }} (${{ matrix.target }})
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: The machine
        run: bash scripts/ci/machine.sh ${{ matrix.base }}

      - name: Rust
        run: bash scripts/ci/setup.sh ${{ matrix.base }} rust

      # The tools are kept between runs: the solvers, and LLVM where it is installed by hand.
      - uses: actions/cache@v4
        if: ${{ matrix.mode != 'compile' }}
        with:
          path: |
            ~/solvers
            ~/llvm
            ~/micromamba
          key: tools-${{ matrix.base }}-${{ hashFiles('scripts/ci/tools.tsv', 'scripts/ci/setup.sh') }}

      - name: LLVM
        if: ${{ matrix.mode != 'compile' }}
        run: bash scripts/ci/setup.sh ${{ matrix.base }} llvm

      - name: z3 and cvc5, pinned by checksum
        if: ${{ matrix.mode != 'compile' }}
        run: bash scripts/ci/setup.sh ${{ matrix.base }} solvers

      - name: QEMU's user mode, for the other CPU's programs
        if: ${{ matrix.qemu }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-user-static binfmt-support
          echo "binfmt_misc/qemu-aarch64:"
          cat /proc/sys/fs/binfmt_misc/qemu-aarch64

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-${{ matrix.base }}-${{ hashFiles('Cargo.lock', 'scripts/ci/setup.sh') }}
          restore-keys: ci-${{ matrix.base }}-

      - name: Clippy
        run: cargo clippy --release --all-targets --locked --workspace -- -D warnings

      # Built first, so that the time a test run may take (stall_seconds) is the tests' and not the
      # compiler's.
      - name: Build the tests
        if: ${{ matrix.mode == 'compile' || matrix.mode == 'test' || matrix.mode == 'ignored' }}
        run: cargo test --release --locked --workspace --no-run

      - name: Tests
        if: ${{ matrix.mode == 'test' }}
        env:
          LENGUA_PROOF_SECONDS: "60"
          RUST_TEST_THREADS: "2"
          FILTER: ${{ inputs.filter }}
          LENGUA_RANDOM_SEED: ${{ inputs.seed }}
          STALL_SECONDS: ${{ inputs.stall_seconds }}
          LENGUA_SKIP_LOG: ${{ github.workspace }}/skips.log
        run: |
          tests='set -o pipefail; cargo test --release --locked --workspace --no-fail-fast -- $FILTER 2>&1 | tee test.log'
          if [ -n "$STALL_SECONDS" ]; then
            bash scripts/stall-report.sh "$STALL_SECONDS" bash -c "$tests"
          else
            bash -c "$tests"
          fi

      - name: The slow ignored tests
        if: ${{ matrix.mode == 'ignored' }}
        env:
          LENGUA_PROOF_SECONDS: "60"
          RUST_TEST_THREADS: "2"
          FILTER: ${{ inputs.filter }}
          LENGUA_RANDOM_SEED: ${{ inputs.seed }}
          LENGUA_CHECK_FOLDER: ${{ inputs.check_folder }}
          LENGUA_CHECK_TARGET: ${{ inputs.check_target }}
          STALL_SECONDS: ${{ inputs.stall_seconds }}
          LENGUA_SKIP_LOG: ${{ github.workspace }}/skips.log
        run: |
          tests='set -o pipefail; cargo test --release --locked --workspace --no-fail-fast -- --ignored --nocapture $FILTER 2>&1 | tee ignored.log'
          if [ -n "$STALL_SECONDS" ]; then
            bash scripts/stall-report.sh "$STALL_SECONDS" bash -c "$tests"
          else
            bash -c "$tests"
          fi

      - name: Benchmarks against C, C++ and Rust
        if: ${{ matrix.mode == 'bench' }}
        run: |
          sudo apt-get install -y -q time
          cargo bench --locked --bench against_rust_and_c 2>&1 | tee bench.log

      - name: The release archive
        if: ${{ matrix.mode == 'release' }}
        run: scripts/release.sh

      # A green run says what it did not cover: libtest hides what a passing test prints, so a
      # test that skips itself notes why (lengua::skiplog) and the notes are counted here.
      - name: What the tests skipped
        if: always()
        run: bash scripts/skip-summary.sh skips.log | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the logs and the server
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-${{ matrix.target }}-${{ matrix.mode }}-${{ github.run_number }}
          path: |
            test.log
            ignored.log
            skips.log
            stall.txt
            bench.log
            BENCHMARKS.md
            BENCHMARKS-aarch64.md
            target/release/lengua-mcp
            target/release/lengua-mcp.exe
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 7
          if-no-files-found: ignore

  # One check that says whether the whole run passed.
  gate:
    name: gate
    needs: [plan, format, test]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ needs.plan.result }} ${{ needs.format.result }} ${{ needs.test.result }}
        run: |
          echo "plan, format, test: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
