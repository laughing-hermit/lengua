name: unported

# The four targets that don't exist yet: macOS and Windows, each on x86-64 and ARM64. lengua is
# meant to be one product on six targets; only the two Linux ones exist (targets.yml and
# arm64.yml). Each of these OSes is a port of its own: their builds stop at lengua's Linux-only
# sandbox (seccomp, Landlock and the supervisor), which is where each port starts. This builds
# lengua natively on each of GitHub's four runners, weekly and on request, so the ports' state
# stays visible without their queues and their always-red builds holding up a push.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

concurrency:
  group: unported-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_VERSION: "1.99.1"
  CARGO_TERM_COLOR: never

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15-intel, target: macos-x86_64 }
          - { runner: macos-15, target: macos-aarch64 }
          - { runner: windows-2025, target: windows-x86_64 }
          - { runner: windows-11-arm, target: windows-aarch64 }
    runs-on: ${{ matrix.runner }}
    # None of them builds yet, which is what this workflow shows.
    continue-on-error: true
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Rust ${{ env.RUST_VERSION }}
        run: |
          if ! command -v rustup > /dev/null; then
            if [ "$RUNNER_OS" = Windows ]; then
              arch=x86_64
              [ "$RUNNER_ARCH" = ARM64 ] && arch=aarch64
              curl -sSfL -o rustup-init.exe \
                "https://static.rust-lang.org/rustup/dist/$arch-pc-windows-msvc/rustup-init.exe"
              ./rustup-init.exe -y --profile minimal --default-toolchain none
              echo "$USERPROFILE/.cargo/bin" >> "$GITHUB_PATH"
              export PATH="$USERPROFILE/.cargo/bin:$PATH"
            else
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain none
              echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
              export PATH="$HOME/.cargo/bin:$PATH"
            fi
          fi
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustc --version --verbose

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: unported-${{ matrix.target }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: unported-${{ matrix.target }}-${{ env.RUST_VERSION }}-

      - name: Build lengua's server natively
        run: cargo build --release --locked --bin lengua-mcp
