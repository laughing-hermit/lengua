name: probe

# What GitHub's runners can say about the kernels under the two routes lengua offers Windows and
# a Mac: Ubuntu 24.04 inside WSL 2, and Ubuntu 24.04 in a Lima VM. Manual, read-only, no secrets,
# nothing is built or tested here. Each job prints its kernel and the Linux security modules it
# lists (landlock must be one, which every lengua run needs), and a step that fails is itself the
# answer: for example, that a hosted Windows runner can't run WSL 2. It runs none of lengua's
# checks, so it promises no route; it shows where a CI job that runs them can go. todo.md,
# "Round 3", "The probe", says how to read it.
#
# The Apple-silicon macOS runners can't run a VM (no nested virtualization), so the Mac job uses
# an Intel runner, and the Linux jobs boot the same Ubuntu cloud image under Lima on both CPUs.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-wsl:
    name: windows-wsl (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      WSL_UTF8: "1"
    steps:
      - name: What the runner has
        continue-on-error: true
        run: |
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsBuildNumber, HyperVisorPresent | Format-List
          wsl --status
          wsl --version

      - name: Update WSL and install Ubuntu 24.04
        continue-on-error: true
        run: |
          wsl --update
          wsl --install --no-launch --web-download -d Ubuntu-24.04
          wsl --list --verbose

      - name: The kernel and Linux security modules inside WSL
        continue-on-error: true
        run: |
          $out = wsl -d Ubuntu-24.04 -u root -- sh -c 'uname -r; cat /sys/kernel/security/lsm'
          $out
          $text = "### WSL on windows-2025`n" + '```' + "`n" + ($out -join "`n") + "`n" + '```'
          $text | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8

  mac-lima:
    name: mac-lima (macos-26-intel)
    runs-on: macos-26-intel
    timeout-minutes: 30
    steps:
      - name: Install Lima
        run: brew install lima

      - name: Start Ubuntu 24.04 in Lima
        continue-on-error: true
        run: |
          limactl --version
          if ! limactl start --tty=false --name=ubuntu template:ubuntu-24.04; then
            limactl delete -f ubuntu || true
            brew install qemu
            limactl start --tty=false --vm-type=qemu --name=ubuntu template:ubuntu-24.04
          fi
          limactl list

      - name: The kernel and Linux security modules inside the VM
        continue-on-error: true
        run: |
          {
            echo '### Lima, Ubuntu 24.04, on macos-26-intel'
            echo '```'
            limactl shell ubuntu sh -c 'uname -r; cat /sys/kernel/security/lsm; . /etc/os-release; echo "$PRETTY_NAME"'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # The guest a Mac's Lima boots is Ubuntu's own 24.04 cloud image (cloud-images.ubuntu.com), the
  # same file on any host, and Lima runs on Linux too, with QEMU. So the Linux runners can boot the
  # very VM a Mac boots, on both CPUs: with KVM where the runner offers /dev/kvm, without it slowly.
  linux-lima:
    name: linux-lima (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: KVM on this runner
        continue-on-error: true
        run: |
          if [ -e /dev/kvm ]; then
            ls -l /dev/kvm
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          else
            echo "no /dev/kvm: QEMU will emulate"
          fi

      - name: Install QEMU and Lima
        run: |
          sudo apt-get update -q
          if [ "$(uname -m)" = x86_64 ]; then
            sudo apt-get install -y -q qemu-system-x86 qemu-utils ovmf
          else
            sudo apt-get install -y -q qemu-system-arm qemu-efi-aarch64 qemu-utils
          fi
          gh release download --repo lima-vm/lima --pattern "lima-[0-9]*-Linux-$(uname -m).tar.gz" \
            --dir "$RUNNER_TEMP"
          sudo tar -C /usr/local -xzf "$RUNNER_TEMP"/lima-*-Linux-"$(uname -m)".tar.gz
          limactl --version

      - name: Start Ubuntu 24.04 in Lima
        continue-on-error: true
        run: |
          limactl start --tty=false --name=ubuntu template:ubuntu-24.04
          limactl list

      - name: The kernel and Linux security modules inside the VM
        continue-on-error: true
        run: |
          {
            echo "### Lima, Ubuntu 24.04, on ${{ matrix.runner }}"
            echo '```'
            limactl shell ubuntu sh -c 'uname -m; uname -r; cat /sys/kernel/security/lsm; . /etc/os-release; echo "$PRETTY_NAME"'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
