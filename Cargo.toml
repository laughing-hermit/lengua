[package]
name = "lengua-mcp"
version = "0.2.0"
edition = "2024"
# Wasmtime 50's own floor (crates.io, 2026-10-29); CI's Rust, in scripts/ci/setup.sh, is above it.
rust-version = "1.97"
license = "Apache-2.0"
description = "MCP server for lengua: idea-driven programming in checked x86-64 assembly"
publish = false

[workspace]
members = ["crates/lengua-os"]

[lib]
name = "lengua"
path = "src/lib.rs"

[[bin]]
name = "lengua-mcp"
path = "src/main.rs"

[dependencies]
# A WebAssembly program's folder: every path resolved beneath it, with no unsafe code.
cap-std = "=4.0.3"
getrandom = "0.4"
hmac = "0.13"
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info", "intel"] }
object = { version = "0.40", default-features = false, features = ["std", "read_core", "elf"] }
rand = { version = "0.10", default-features = false, features = ["chacha"] }
rmcp = { version = "3.8.0", features = ["transport-io"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustix = { version = "1", features = ["net", "process", "termios", "thread"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "2.0"
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "1.1"
unicode-normalization = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# The WebAssembly engine, pinned: Cranelift, its own compiled-module cache, nothing else of its
# defaults (no WASI of its own, no component model, no GC, no threads).
wasmtime = { version = "=50.0.1", default-features = false, features = ["cranelift", "cache", "parallel-compilation", "runtime", "std"] }
# The validator Wasmtime 50.0.1 itself uses (^0.261.0), so a module is checked as the engine reads it.
wasmparser = { version = "=0.261.0", default-features = false, features = ["std", "validate", "features", "simd"] }
# main.wat's text, with each instruction's place in it, and lengua's library merged in.
wast = { version = "=261.0.0", default-features = false, features = ["wasm-module"] }
webpki-roots = "1"

# What only some systems have: the kernel's confinement and counters are Linux's, and the Unix
# calls are Unix's (the nix crate is empty elsewhere). macOS and Windows get their own in rounds 3
# and 4 of the roadmap.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["process", "signal"] }
# The calls that need unsafe code, each in a safe function (this crate forbids unsafe code).
lengua-os = { path = "crates/lengua-os" }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
# The broker opens each path beneath a program's folder (openat2) and hands descriptors back.
rustix = { version = "1", features = ["fs"] }
nix = { version = "0.31", default-features = false, features = ["process", "signal"] }
perf-event2 = "0.7.4"
seccompiler = "0.5"

# Linux only: the terminal tests give a program a pseudo-terminal for standard input.
[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "1", features = ["fs", "pty", "termios"] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
jsonschema = { version = "0.60", default-features = false }
rmcp = { version = "3.8.0", features = ["client", "transport-child-process"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"

[[bench]]
name = "against_rust_and_c"
harness = false
