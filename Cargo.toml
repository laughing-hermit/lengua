[workspace]
resolver = "3"
members = ["crates/lengua-idea", "crates/lengua-mcp"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
repository = "https://github.com/laughing-hermit/lengua"
publish = false

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
