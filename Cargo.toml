[package]
name = "lengua-mcp"
version = "0.2.0"
edition = "2024"
# Wasmtime 50's own floor (crates.io, 2026-10-29); the Rust rust-toolchain.toml pins is above it.
rust-version = "1.97"
license = "Apache-2.0"
description = "MCP server for lengua: idea-driven programming in checked WebAssembly"
publish = false

# lengua-os holds the calls that need unsafe code; lengua-run is the small program that runs a
# checked program, this crate built without the engine's compiler; xtask is lengua's tooling
# (`cargo xtask`).
[workspace]
members = ["crates/lengua-os", "crates/lengua-run", "xtask"]

[lib]
name = "lengua"
path = "src/lib.rs"

[[bin]]
name = "lengua-mcp"
path = "src/main.rs"

# The small process `lengua-mcp measure` starts a program from on Linux, beside lengua-mcp, so
# that the program's peak memory is its own: Linux begins a child's count at its parent's, and
# lengua-mcp's is larger than many a program's (src/measure.rs).
[[bin]]
name = "lengua-spawn"
path = "src/bin/lengua-spawn.rs"

# `compiler`: the engine's compiler, Cranelift, with Wasmtime's cache of compiled modules, which
# check, the tests' workers and the `run` tool need, and lengua-mcp is built with. Without it
# the crate only runs modules compiled before: lengua-run is built so (crates/lengua-run), and a
# process that maps no compiler starts sooner and holds less. Cargo gives one build of the whole
# workspace one set of features, so only `cargo build --package lengua-run` builds it so.
[features]
default = ["compiler"]
compiler = ["wasmtime/cranelift", "wasmtime/cache", "wasmtime/parallel-compilation", "lengua-os/compiler"]

[dependencies]
# A WebAssembly program's folder: every path resolved beneath it, with no unsafe code.
cap-std = "=4.0.3"
getrandom = "0.4"
# HMAC-SHA256 of the locks, on the digest 0.10.7 that sha2 0.10.9 is on: hmac 0.12's last release.
hmac = "0.12.1"
# Reads the x86-64 machine code the engine compiles main.wat to, for an idea with a `- Secret:`
# line (src/checker/wasm/machine.rs): the decoder and what each instruction does, nothing else.
iced-x86 = { version = "=1.21.0", default-features = false, features = ["std", "decoder", "instr_info"] }
# The calls that need unsafe code, each in a safe function (this crate forbids unsafe code): the
# load of a compiled module that carries the seal of the user's key; on Linux, the fork
# lengua-spawn runs a program in, and its counts; on Windows, a process's times and peak memory,
# which `lengua-mcp measure` reads, and the CPU's caches.
lengua-os = { path = "crates/lengua-os" }
rand = { version = "0.10", default-features = false, features = ["chacha"] }
rmcp = { version = "3.8.0", features = ["transport-io"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustix = { version = "1", features = ["process", "thread"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "2.0"
serde_json = "1"
# SHA-256, the 0.10.9 that wasmtime's cache and Cranelift already bring: one SHA-256 in the binary.
sha2 = "0.10.9"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "1.1"
unicode-normalization = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# The WebAssembly engine, pinned: its runtime, and with the `compiler` feature Cranelift and its
# own compiled-module cache; nothing else of its defaults (no WASI of its own, no component
# model, no GC, no threads).
wasmtime = { version = "=50.0.1", default-features = false, features = ["runtime", "std"] }
# The validator Wasmtime 50.0.1 itself uses (^0.261.0), so a module is checked as the engine reads it.
wasmparser = { version = "=0.261.0", default-features = false, features = ["std", "validate", "features", "simd"] }
# main.wat's text, with each instruction's place in it, and lengua's library merged in.
wast = { version = "=261.0.0", default-features = false, features = ["wasm-module"] }
webpki-roots = "1"

# The Unix calls (the nix crate is empty elsewhere): `getrusage`, which `lengua-mcp measure` reads
# a child's times and peak memory with, and the signals it and the prover's watch send.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["process", "resource", "signal"] }

# Linux's counters of a program's cache misses, which `lengua-mcp measure` reads.
[target.'cfg(target_os = "linux")'.dependencies]
perf-event2 = "0.7.4"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
jsonschema = { version = "0.60", default-features = false }
rmcp = { version = "3.8.0", features = ["client", "transport-child-process"] }

# The build that ships and that the gate measures (`cargo bench` takes it too): lengua-mcp without
# the symbols nothing maps, which the native rows count in lengua's size. An MSVC executable keeps
# its symbols in the .pdb, so on Windows this changes nothing. One codegen unit and link-time
# optimization over every crate put fewer, closer code pages in every run. A panic still unwinds:
# the program's thread reports one as an error, and the server outlives a tool's.
[profile.release]
strip = "symbols"
codegen-units = 1
lto = "fat"
panic = "unwind"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"

[[bench]]
name = "against_rust_and_c"
harness = false
