[package]
name = "lengua-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
lengua-idea = { path = "../lengua-idea" }
wasmtime = { version = "=50.0.1", default-features = false, features = ["runtime", "std", "component-model"] }
wasmtime-wasi = { version = "=50.0.1", default-features = false, features = ["p2"] }
wasmtime-wasi-io = { version = "=50.0.1", default-features = false, features = ["std"] }
wasmtime-wasi-http = { version = "=50.0.1", default-features = false, features = ["p2"] }
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
http = "1"
http-body-util = "0.1"
tokio = { version = "1", default-features = false, features = ["net", "rt", "time"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
tokio = { version = "1", default-features = false, features = ["io-util", "net", "rt", "time"] }

[lints]
workspace = true
