[package]
name = "lengua-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
lengua-idea = { path = "../lengua-idea" }
lengua-host = { path = "../lengua-host" }
lengua-seal = { path = "../lengua-seal" }
rmcp = { version = "3.10.0", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
wasmtime = { version = "=50.0.1", default-features = false, features = ["cranelift", "runtime", "std", "component-model"] }
getrandom = { version = "0.4.3", default-features = false }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
