[package]
name = "lean-probe"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
description = "Temporary, for W19's measurements: the least a process can do to run a precompiled module in Wasmtime's runtime, with no compiler."
publish = false

[dependencies]
lengua-os = { path = "../lengua-os" }
wasmparser = { version = "=0.261.0", default-features = false, features = ["std", "features", "simd"] }
wasmtime = { version = "=50.0.1", default-features = false, features = ["runtime", "std"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
