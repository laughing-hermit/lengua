[package]
name = "lengua-os"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "lengua's calls into the operating system: the only crate of the workspace that may hold unsafe code, each call in a safe function with a test on its system's runner."
publish = false

[lib]
name = "lengua_os"
path = "src/lib.rs"

# The workspace's one crate allowed unsafe code, which the lengua crate forbids (todo.md, round 1).
[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"

# The Unix calls that need unsafe code (the nix crate is empty elsewhere): on Linux, the fork
# lengua-spawn starts a program with, its wait and its counts; on macOS, the system's counts of the
# computer's memory and of a process's.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["process", "resource", "signal"] }

# Windows's counters of a process (its times, its working set and its peak) and of the computer's
# memory. The version the lock already holds for the rest of the workspace.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading"] }
